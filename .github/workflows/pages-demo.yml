name: Deploy fictional MediTrack demo to Pages
on:
  push:
    branches: [icure-replication]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meditrack-demo-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/icure-replication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/app.js
      - run: node tests/regression.mjs
      - run: node tests/cloud-regression.mjs
      - name: Package only public demo assets
        run: |
          mkdir -p site/assets
          cp index.html site/index.html
          cp assets/app.js assets/app.css site/assets/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested demo
        id: deployment
        uses: actions/deploy-pages@v4
# Trigger deployment after Pages source activation.
