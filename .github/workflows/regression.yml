name: Demo regression tests
on:
  push:
    branches: [icure-replication, main]
  pull_request:
    branches: [icure-replication, main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/app.js
      - run: node tests/regression.mjs
