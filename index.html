const groups=[["Overview", [["Dashboard", "/dashboard"], ["Notifications", "/notifications"], ["Chat", "/chat"]]], ["Administration", [["User Management", "/staff"]]], ["Clinical", [["Patient Search", "/patient-search"], ["Patients (Cash)", "/patients"], ["OPD Queue (Cash)", "/opd"], ["Appointments", "/appointments"], ["IPD", "/ipd"], ["Doctor's Office", "/doctor"], ["Nursing Station", "/nursing"]]], ["Diagnostics", [["Laboratory", "/lab"], ["Medical Imaging", "/imaging"]]], ["Services", [["Pharmacy", "/pharmacy"], ["Ambulance", "/ambulance"], ["Inventory", "/inventory"]]], ["Finance", [["Accounts", "/billing"], ["General Ledger", "/general-ledger"], ["Finance Analytics", "/finance-analytics"], ["Insurance", "/insurance"]]], ["HR & Reports", [["Attendance", "/attendance"], ["HR & Payroll", "/hr"], ["Reports", "/reports"], ["Settings", "/settings"], ["Audit Logs", "/audit-logs"]]], ["Resources", [["Holy Bible", "/bible"]]]];const key='meditrack-fictional-v1';const seed={patients:[{id:'MT-001',name:'Demo Patient A',age:32,sex:'Female',phone:'Demo only'},{id:'MT-002',name:'Demo Patient B',age:45,sex:'Male',phone:'Demo only'}],visits:[{id:'V-001',patient:'MT-001',status:'Waiting',note:''}],lab:[],rx:[],bills:[],audit:[]};let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{db=structuredClone(seed)}let route='/dashboard',signed=false;let tab=0;db.extra??={};const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(action){db.extra??={};db.audit.push({action,date:new Date().toLocaleString()});try{localStorage.setItem(key,JSON.stringify(db))}catch{} render()}function patient(id){return db.patients.find(p=>p.id===id)?.name||id}function nav(r){profileIndex=-1;activeVisit=-1;route=r;tab=0;render()}function login(){signed=true;render()}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function btn(label,action){return `<button onclick="${action}">${label}</button>`}function card(label,value,link){return `<button class="card" style="text-align:left" onclick="nav('${link}')"><span class="muted">${label}</span><div class="stat">${value}</div></button>`}function form(title,fields,callback){modal.innerHTML='<h2>'+title+'</h2><form id="f">'+fields.map(([name,label,type,options])=>'<label>'+label+(options?'<select name="'+name+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'" required></textarea>':'<input name="'+name+'" type="'+type+'" required '+(type==='number'?'min="0"':'')+'>')+'</label>').join('')+'<div class="row"><button type="button" onclick="modal.close()">Cancel</button><button class="primary">Save</button></div></form>';modal.querySelector('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));modal.close()};modal.showModal()}function register(){form('Register Patient',[['name','Fictional patient name','text'],['age','Age','number'],['sex','Sex','select',[['Female','Female'],['Male','Male'],['Other','Other']]],['phone','Demo contact label','text']],v=>{db.patients.push({...v,id:'MT-'+Date.now()});save('Registered fictional patient')})}function visit(i){db.visits.push({id:'V-'+Date.now(),patient:db.patients[i].id,status:'Waiting',note:''});save('Created OPD visit');nav('/opd')}function legacyConsult(i){form('Consultation — fictional notes only',[['note','Clinical note','textarea'],['status','Visit status','select',[['In consultation','In consultation'],['Completed','Completed']]]],v=>{Object.assign(db.visits[i],v);save('Updated consultation')})}function order(i,type){form(type==='lab'?'Laboratory order':'Prescription — demonstration only',[['item',type==='lab'?'Test name':'Item name','text']],v=>{db[type].push({visit:db.visits[i].id,patient:db.visits[i].patient,item:v.item,status:'Pending'});save('Created '+type+' order')})}function complete(type,i){db[type][i].status='Completed';save('Completed '+type+' order')}function bill(){form('Create demo invoice',[['patient','Patient','select',db.patients.map(p=>[p.id,p.name])],['item','Service','text'],['amount','Amount (SSP)','number']],v=>{if(!Number.isSafeInteger(Number(v.amount))||Number(v.amount)<=0)return alert('Enter a positive whole SSP amount.');db.bills.push({...v,id:financialId(),department:'Manual',paid:0,status:'Unpaid'});save('Created invoice')})}function pay(i){db.bills[i].status='Paid';save('Recorded simulated payment')}function filterRows(v){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(v.toLowerCase()))}function content(){if(route==='/ipd')return ipdView();if(route==='/nursing')return nursingView();if(route==='/billing')return billingView();if(route==='/patients'&&profileIndex>=0)return profileView();if(route==='/lab')return labView();if(route==='/pharmacy')return pharmacyView();if(route==='/doctor'&&activeVisit>=0)return clinicalView();let title=groups.flatMap(g=>g[1]).find(x=>x[1]===route)?.[0]||'Dashboard';if(route==='/dashboard'){let metrics=[['OPD Patients',db.visits.length,'/opd'],['IPD Admissions',records('/ipd',0).filter(x=>x.status==='Admitted').length,'/ipd'],['Available Beds',availableBeds().length,'/ipd'],['Lab Orders',db.lab.length,'/lab'],['Rx Pending',db.rx.filter(x=>x.status==='Pending').length,'/pharmacy'],['Rx Completed',db.rx.filter(x=>x.status==='Completed').length,'/pharmacy'],['Doctors Active',1,'/doctor'],['Staff On Duty',1,'/attendance'],['Cash Patients',db.patients.length,'/patients'],['Insurance Patients',0,'/insurance'],['Total Patients',db.patients.length,'/patients'],['Revenue (SSP)',db.bills.reduce((a,b)=>a+amountPaid(b),0).toLocaleString(),'/billing']];return '<h1>Welcome, Demo Administrator</h1><p>Hospital operations overview</p><div class="grid">'+metrics.map(x=>card(...x)).join('')+'</div><div class="grid"><div class="card"><h2>Clinical Summary</h2>Waiting visits: '+db.visits.filter(v=>v.status==='Waiting').length+'<p>Completed visits: '+db.visits.filter(v=>v.status==='Completed').length+'</p></div><div class="card"><h2>Laboratory & Pharmacy</h2>Pending tests: '+db.lab.filter(x=>x.status==='Pending').length+'<p>Pending prescriptions: '+db.rx.filter(x=>x.status==='Pending').length+'</p></div></div>'}let head='<div class="row"><div><h1>'+esc(title)+'</h1><p>Offline demonstration workspace</p></div>';let search='<input placeholder="Search records…" oninput="filterRows(this.value)">';if(['/patients','/patient-search'].includes(route))return '<div class="row"><div><h1>Patient Registry</h1><p>Comprehensive view of all registered patients</p></div>'+btn('Register Patient','register()')+'</div><div class="grid">'+card('Total Patients',db.patients.length,'/patients')+card('Cash Patients',db.patients.length,'/patients')+'</div><div class="card">'+search+table(['Registration No.','Name','Age','Sex','Contact','Action'],db.patients.map((p,i)=>[esc(p.id),esc(p.name),esc(p.age),esc(p.sex),esc(p.phone),btn('Profile',`openProfile(${i})`)+' '+btn('Start visit',`visit(${i})`)]))+'</div>';if(['/opd','/doctor'].includes(route))return head+'</div><div class="card">'+search+table(['Visit','Patient','Status','Clinical note','Actions'],db.visits.map((v,i)=>[esc(v.id),esc(patient(v.patient)),esc(v.status),esc(v.note),btn('Consult',`openClinical(${i})`)+' '+btn('Lab order',`order(${i},\'lab\')`)+' '+btn('Prescription',`order(${i},\'rx\')`)]))+'</div>';if(['/lab','/pharmacy'].includes(route)){let t=route==='/lab'?'lab':'rx';return head+'</div><div class="card">'+search+table(['Patient','Item','Status','Action'],db[t].map((v,i)=>[esc(patient(v.patient)),esc(v.item),esc(v.status),v.status==='Pending'?btn('Mark complete',`complete(\'${t}\',${i})`):'—']))+'</div>'}if(route==='/billing')return head+btn('Create invoice','bill()')+' '+btn('Invoice dispensed order','billOrders()')+'</div><div class="card">'+table(['Patient','Service','SSP','Status','Action'],db.bills.map((v,i)=>[esc(patient(v.patient)),esc(v.item),esc(v.amount),esc(v.status),v.status==='Unpaid'?btn('Record payment',`pay(${i})`):'—']))+'</div>';if(route==='/audit-logs')return head+'</div><div class="card">'+table(['Action','Time'],db.audit.map(v=>[esc(v.action),esc(v.date)]))+'</div>';return head+'</div>'+extended()}

function records(r,t){return db.extra?.[r+'|'+t]||[]}
function changeTab(t){tab=t;render()}
function fieldsFor(spec){return spec[2].map(f=>f[2]==='patient'?[f[0],f[1],'select',db.patients.map(p=>[p.id,p.name])]:f)}
function addExtra(){let spec=modules[route][tab],k=route+'|'+tab;form('New '+spec[1],fieldsFor(spec),v=>{db.extra??={};(db.extra[k]??=[]).push({...v,status:spec[3][0]});save('Created '+spec[1])})}
function editExtra(i){let spec=modules[route][tab],r=records(route,tab)[i];form('Update '+spec[1],[['status','Status','select',spec[3].map(x=>[x,x])]],v=>{r.status=v.status;save('Updated '+spec[1])})}
function listing(spec,rows,editable=false){return table([...spec[2].map(f=>f[1]),'Status',...(editable?['Action']:[])],rows.map((r,i)=>[...spec[2].map(f=>esc(f[2]==='patient'?patient(r[f[0]]):r[f[0]])),esc(r.status),...(editable?[btn('Update',`editExtra(${i})`)]:[])]))}
function exportExtra(){let spec=modules[route][tab],rows=records(route,tab);let quote=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';let csv=[spec[2].map(f=>f[1]).concat('Status').map(quote).join(','),...rows.map(r=>spec[2].map(f=>quote(r[f[0]])).concat(quote(r.status)).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='meditrack-demo.csv';a.click();URL.revokeObjectURL(a.href)}
function extended(){let specs=modules[route];if(!specs)return '';let spec=specs[tab]||specs[0],mode=spec[2],body='';if(Array.isArray(mode)){body='<div class="row"><input placeholder="Search records…" oninput="filterRows(this.value)">'+btn('Export CSV','exportExtra()')+btn('New '+spec[1],'addExtra()')+'</div>'+listing(spec,records(route,tab),true)}else if(mode==='mirror'||mode==='discharged'||mode==='journal'){let i=mode==='journal'?1:0;body=listing(specs[i],records(route,i).filter(r=>mode==='mirror'||r.status===(mode==='journal'?'Posted':'Discharged')))}else if(['attendance','insurance','payroll'].includes(mode)){let [r,i]=mode==='attendance'?['/attendance',0]:mode==='insurance'?['/insurance',2]:['/hr',2];body=listing(modules[r][i],records(r,i))}else if(mode==='finance'){let paid=db.bills.reduce((a,b)=>a+amountPaid(b),0),unpaid=db.bills.reduce((a,b)=>a+balance(b),0);body='<div class="grid">'+card('Collected SSP',paid.toLocaleString(),'/billing')+card('Outstanding SSP',unpaid.toLocaleString(),'/billing')+card('Invoices',db.bills.length,'/billing')+'</div><p>Simulated cash collections; not an accrual income statement or audited report.</p>'}else if(mode==='clinical'){body='<div class="grid">'+card('Visits',db.visits.length,'/opd')+card('Lab orders',db.lab.length,'/lab')+card('Admissions',records('/ipd',0).length,'/ipd')+'</div>'}else if(mode==='summary'){body='<div class="grid">'+specs.map((x,i)=>Array.isArray(x[2])?'<div class="card">'+esc(x[0])+'<div class="stat">'+records(route,i).length+'</div></div>':'').join('')+'</div>'}else if(['notifications','read','unread'].includes(mode)){let seen=db.seen||0;body=btn('Mark all read','markRead()')+table(['Activity','Time'],db.audit.filter((x,i)=>mode==='notifications'||(mode==='read'?i<seen:i>=seen)).map(x=>[esc(x.action),esc(x.date)]))}else if(mode==='bible'){body='<p>Original reading and search navigation retained. Bible content and audio services are not bundled in this offline demo.</p>'}return '<div class="tabs">'+specs.map((x,i)=>`<button class="${i===tab?'primary':''}" onclick="changeTab(${i})">${esc(x[0])}</button>`).join('')+'</div><div class="card"><h2>'+esc(spec[1])+'</h2>'+body+'</div>'}
function markRead(){db.seen=db.audit.length;try{localStorage.setItem(key,JSON.stringify(db))}catch{}render()}

function render(){if(!signed){app.innerHTML='<div class="login"><section><div><div class="brand">✚ MediTrack Pro</div><h1>Login to Your Account</h1><p>Enter the independent, fictional-data demo.</p><button class="primary" onclick="login()">Enter demo</button><p>Not a secure clinical system. Do not enter real patient data.</p></div></section><section><h1>Hospital Management System</h1><p>Integrated clinical and administrative workflows</p></section></div>';return}app.innerHTML='<aside id="sidebar"><div class="brand">✚ MediTrack Pro</div>'+groups.map(([g,items])=>'<div class="group">'+g+'</div>'+items.map(([n,r])=>`<button class="nav ${r===route?'active':''}" onclick="nav('${r}')">${n}</button>`).join('')).join('')+'</aside><main><header><button id="menu" onclick="document.querySelector(\'#sidebar\').classList.toggle(\'open\')">☰</button><span>Hospital Management System</span><span class="pill">Demo Administrator</span><button onclick="if(confirm(\'Reset all fictional demo records?\')){db=structuredClone(seed);save(\'Reset demo\')}">Reset</button><button onclick="signed=false;render()">Sign out</button></header><article><div class="notice">Offline preview V7 · Fictional data only · No connection to iCURE</div>'+content()+'</article></main>'}

function addDrug(){form('Add fictional stock item',[['name','Medication label','text'],['batch','Batch label','text'],['expiry','Expiry date','date'],['qty','Opening quantity','number'],['price','Unit price SSP','number']],v=>{if(!v.name.trim()||!Number.isInteger(+v.qty)||+v.qty<0||!Number.isFinite(+v.price)||+v.price<0)return alert('Invalid stock values');db.drugs.push({...v,id:'DR-'+Date.now(),qty:+v.qty,price:+v.price});save('Added demo drug catalogue item')})}
function restock(i){form('Stock receipt',[['qty','Quantity received','number'],['ref','Demo receipt reference','text']],v=>{if(!Number.isInteger(+v.qty)||+v.qty<=0)return alert('Enter a positive whole quantity');db.drugs[i].qty+=+v.qty;db.stockMoves.push({item:db.drugs[i].name,qty:+v.qty,ref:v.ref,date:new Date().toLocaleString()});save('Received demo pharmacy stock')})}
function dispense(i){let x=db.rx[i];if(x.status!=='Pending')return;let available=db.drugs.filter(d=>d.qty>0&&d.expiry>=new Date().toISOString().slice(0,10)&&d.name.trim().toLowerCase()===x.item.trim().toLowerCase());if(!available.length)return alert('Add matching fictional stock with a valid expiry first.');form('Dispense fictional prescription',[['drug','Stock batch','select',available.map(d=>[d.id,d.name+' · '+d.batch+' · '+d.qty+' available'])],['qty','Quantity to dispense','number']],v=>{let d=db.drugs.find(z=>z.id===v.drug),q=+v.qty;if(!d||!Number.isInteger(q)||q<=0||q>d.qty||x.status!=='Pending'||(Number(x.quantity)>0&&q!==Number(x.quantity)))return alert('Quantity must match the order and available stock.');d.qty-=q;x.status='Completed';x.dispensedQty=q;x.batch=d.batch;x.dispensedAt=new Date().toLocaleString();db.stockMoves.push({item:d.name,qty:-q,ref:x.visit||x.patient,date:x.dispensedAt});save('Dispensed demo prescription')})}
function pharmacyView(){let tabs=['Prescriptions','Drug catalogue','Stock movements'];let body=pharmacyTab===0?table(['Patient','Visit','Medication','Dosage','Quantity','Status','Action'],db.rx.map((x,i)=>[esc(patient(x.patient)),esc(x.visit),esc(x.item),esc(x.dosage),esc(x.quantity),esc(x.status),x.status==='Pending'?btn('Dispense','dispense('+i+')'):'—'])):pharmacyTab===1?btn('Add stock item','addDrug()')+table(['Medication','Batch','Expiry','Balance','Unit price SSP','Action'],db.drugs.map((d,i)=>[esc(d.name),esc(d.batch),esc(d.expiry),esc(d.qty),esc(d.price),btn('Receive stock','restock('+i+')')])):table(['Item','Quantity change','Reference','Date'],db.stockMoves.map(x=>[esc(x.item),esc(x.qty),esc(x.ref),esc(x.date)]));return '<h1>Pharmacy</h1><p>Fictional prescription and stock management</p><div class="grid">'+[['Pending prescriptions',db.rx.filter(x=>x.status==='Pending').length],['Dispensed',db.rx.filter(x=>x.status==='Completed').length],['Stock batches',db.drugs.length],['Low stock (≤ 5)',db.drugs.filter(x=>x.qty<=5).length]].map(([l,v])=>'<div class="card">'+l+'<div class="stat">'+v+'</div></div>').join('')+'</div><div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===pharmacyTab?'primary':'')+'" onclick="pharmacySwitch('+i+')">'+t+'</button>').join('')+'</div><div class="card">'+body+'</div>'}
function billOrders(){let candidates=db.rx.filter(x=>x.status==='Completed'&&!x.billed&&x.dispensedQty>0).map(x=>({x,d:db.drugs.find(d=>d.name.trim().toLowerCase()===x.item.trim().toLowerCase()&&d.batch===x.batch)})).filter(z=>z.d);if(!candidates.length)return alert('No unbilled dispensed demo prescriptions.');form('Invoice dispensed prescription',[['order','Order','select',candidates.map((z,i)=>[String(i),patient(z.x.patient)+' · '+z.x.item+' · SSP '+z.d.price*z.x.dispensedQty])]],v=>{let z=candidates[+v.order];if(!z||z.x.billed)return;db.bills.push({id:financialId(),department:'Pharmacy',paid:0,patient:z.x.patient,visit:z.x.visit,item:z.x.item,amount:z.d.price*z.x.dispensedQty,status:'Unpaid'});z.x.billed=true;save('Generated invoice from demo prescription')})}

const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const amountPaid=b=>b.status==='Paid'?Number(b.amount):Number(b.paid||0);
const balance=b=>Math.max(0,Number(b.amount)-amountPaid(b));
function financialId(){return 'DEMO-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
db.bills.forEach(b=>{b.id??=financialId();b.department??='Manual';});
function addPrice(){form('Demo service price',[['department','Department','select',[['Lab','Laboratory'],['Imaging','Imaging'],['Services','Clinical services']]],['item','Exact service label','text'],['price','Unit price SSP','number']],v=>{let price=Number(v.price);if(!v.item.trim()||!Number.isSafeInteger(price)||price<=0)return alert('Enter a positive whole SSP amount.');let p=db.priceList.find(x=>x.department===v.department&&x.item.toLowerCase()===v.item.trim().toLowerCase());if(p)p.price=price;else db.priceList.push({...v,item:v.item.trim(),price});save('Updated demo service price')})}
function chargeCandidates(){let items=[...db.lab.map(x=>({x,department:'Lab'})),...records('/imaging',0).map(x=>({x,department:'Imaging'})),...db.visits.flatMap(v=>(v.services||[]).map(x=>({x,department:'Services'})))];return items.filter(z=>!z.x.billed&&z.x.patient&&z.x.status!=='Cancelled').map(z=>{let item=z.x.item||z.x.study||'',p=db.priceList.find(p=>p.department===z.department&&p.item.toLowerCase()===item.trim().toLowerCase());return {...z,item,qty:Number(z.x.quantity||1),price:p?.price}})}
function syncCharges(){let rows=chargeCandidates().filter(z=>Number.isSafeInteger(z.qty)&&z.qty>0&&Number.isSafeInteger(z.price*z.qty)&&z.price*z.qty>0);if(!rows.length)return alert('No unbilled orders matching the demo price list.');if(!confirm('Generate '+rows.length+' invoice line(s) from matching orders?'))return;for(let z of rows){if(z.x.billed)continue;db.bills.push({id:financialId(),patient:z.x.patient,visit:z.x.visit,item:z.item,department:z.department,amount:z.price*z.qty,paid:0,status:'Unpaid'});z.x.billed=true;}save('Generated departmental demo charges')}
function billingPay(i){let b=db.bills[i],due=balance(b);if(!due)return;form('Record simulated payment — SSP '+money(due)+' outstanding',[['amount','Amount SSP','number'],['method','Method','select',[['Cash','Cash'],['Mobile money','Mobile money'],['Bank','Bank transfer']]],['reference','Demo reference','text']],v=>{let n=Number(v.amount);if(!Number.isSafeInteger(n)||n<=0||n>balance(b))return alert('Payment must be a positive whole amount not exceeding the balance.');b.paid=amountPaid(b)+n;b.status=b.paid>=Number(b.amount)?'Paid':'Partially paid';db.payments.push({id:financialId(),invoice:b.id,patient:b.patient,amount:n,method:v.method,reference:v.reference,date:new Date().toLocaleString()});save('Recorded partial or full demo payment')})}
function receipt(i){let p=db.payments[i],b=db.bills.find(x=>x.id===p.invoice);let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write('<!doctype html><html><head><title>Demo payment receipt</title></head><body style="font:15px Arial;margin:35px"><h1>MediTrack Pro</h1><strong>FICTIONAL DEMO — NOT A FINANCIAL RECEIPT</strong><h2>Payment receipt</h2><p>Receipt: '+esc(p.id)+'</p><p>Patient: '+esc(patient(p.patient))+'</p><p>Invoice: '+esc(p.invoice)+'</p><p>Service: '+esc(b?.item)+'</p><p>Amount received: SSP '+money(p.amount)+'</p><p>Method: '+esc(p.method)+' · '+esc(p.reference)+'</p><p>Date: '+esc(p.date)+'</p><p>Current invoice balance: SSP '+money(balance(b||{}))+'</p></body></html>');w.document.close();w.print()}

function createWard(){form('Create demo ward',[['name','Ward name','text'],['capacity','Number of beds (1–100)','number']],v=>{let n=+v.capacity;if(!v.name.trim()||wards().some(w=>w.name.toLowerCase()===v.name.trim().toLowerCase())||!Number.isInteger(n)||n<1||n>100)return alert('Enter a unique ward name and valid capacity.');wards().push({name:v.name.trim(),capacity:n,status:'Active'});save('Created demo ward')})}
function admitDemo(){let beds=availableBeds(),patients=db.patients.filter(p=>!activeAdmissions().some(a=>a.patient===p.id));if(!beds.length||!patients.length)return alert('Create a ward with available beds and register an eligible fictional patient first.');form('Admit fictional patient',[['patient','Patient','select',patients.map(p=>[p.id,p.name])],['bedIndex','Available bed','select',beds.map((b,i)=>[String(i),b.ward+' / Bed '+b.bed])],['doctor','Attending demo clinician','text'],['reason','Admission reason','textarea'],['diagnosis','Working diagnosis','text']],v=>{let b=beds[+v.bedIndex];if(!b||!availableBeds().some(x=>x.ward===b.ward&&x.bed===b.bed)||activeAdmissions().some(a=>a.patient===v.patient))return alert('Bed or patient is no longer available.');admissions().push({...v,...b,id:financialId(),status:'Admitted',admittedAt:new Date().toLocaleString(),rounds:[]});save('Admitted fictional inpatient')})}
function transferDemo(i){let a=admissions()[i],beds=availableBeds();if(a.status!=='Admitted'||!beds.length)return alert('No available destination bed.');form('Transfer bed',[['destination','Destination','select',beds.map((b,i)=>[String(i),b.ward+' / Bed '+b.bed])]],v=>{let b=beds[+v.destination];if(!b||!availableBeds().some(x=>x.ward===b.ward&&x.bed===b.bed))return alert('Bed unavailable');Object.assign(a,b);save('Transferred fictional inpatient')})}
function wardRound(i){let a=admissions()[i];if(a.status!=='Admitted')return;form('Record fictional ward round',[['findings','Findings / assessment','textarea'],['plan','Plan','textarea']],v=>{(a.rounds??=[]).push({...v,date:new Date().toLocaleString()});save('Recorded demo ward round')})}
function dischargeDemo(i){let a=admissions()[i];if(a.status!=='Admitted')return;form('Discharge fictional inpatient',[['finalDiagnosis','Final diagnosis','text'],['treatment','Treatment given','textarea'],['medications','Discharge medications','textarea'],['followup','Follow-up instructions','textarea'],['followupDate','Follow-up date','date']],v=>{Object.assign(a,v,{status:'Discharged',dischargedAt:new Date().toLocaleString()});save('Discharged fictional inpatient and released bed')})}
function admissionPrint(i){let a=admissions()[i];let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write('<html><head><title>Demo discharge summary</title></head><body style="font:14px Arial;margin:35px"><h1>MediTrack Pro — Discharge summary</h1><strong>FICTIONAL DEMO — NOT FOR CLINICAL USE</strong><p>Patient: '+esc(patient(a.patient))+' · '+esc(a.patient)+'</p><p>Admission: '+esc(a.id)+'</p>'+[['admittedAt','Admission date'],['dischargedAt','Discharge date'],['reason','Reason for admission'],['finalDiagnosis','Final diagnosis'],['treatment','Treatment given'],['medications','Discharge medications'],['followup','Follow-up instructions'],['followupDate','Follow-up date']].map(([k,l])=>'<h3>'+l+'</h3><p style="white-space:pre-wrap">'+esc(a[k]||'—')+'</p>').join('')+'<p>Demo clinician signature: __________________</p></body></html>');w.document.close();w.print()}
function ipdView(){let tabs=['Admissions','Wards','Discharged','Reports'];let body='';if(tab===0||tab===2){body=(tab===0?btn('Admit patient','admitDemo()'):'')+table(['Admission','Patient','Ward','Bed','Diagnosis','Status','Actions'],admissions().map((a,i)=>({a,i})).filter(({a})=>a.status===(tab===0?'Admitted':'Discharged')).map(({a,i})=>[esc(a.id),esc(patient(a.patient)),esc(a.ward),esc(a.bed),esc(a.finalDiagnosis||a.diagnosis||a.reason),esc(a.status),tab===0?btn('Ward round','wardRound('+i+')')+' '+btn('Transfer','transferDemo('+i+')')+' '+btn('Discharge','dischargeDemo('+i+')'):btn('Print summary','admissionPrint('+i+')')]))}else if(tab===1)body=btn('Create ward','createWard()')+table(['Ward','Capacity','Occupied','Available'],wards().map(w=>[esc(w.name),esc(w.capacity),activeAdmissions().filter(a=>a.ward===w.name).length,availableBeds().filter(b=>b.ward===w.name).length]));else body=table(['Patient','Ward','Date','Assessment','Plan'],admissions().flatMap(a=>(a.rounds||[]).map(r=>[esc(patient(a.patient)),esc(a.ward),esc(r.date),esc(r.findings),esc(r.plan)])));return '<h1>Inpatient department</h1><p>Admissions, bed management and discharge · Fictional records</p><div class="grid">'+[['Current admissions',activeAdmissions().length],['Available beds',availableBeds().length],['Discharged',admissions().filter(a=>a.status==='Discharged').length]].map(([l,v])=>'<div class="card">'+l+'<div class="stat">'+v+'</div></div>').join('')+'</div><div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===tab?'primary':'')+'" onclick="changeTab('+i+')">'+t+'</button>').join('')+'</div><div class="card">'+body+'</div>'}
function nursingEntries(){return [...activeAdmissions().map(a=>({id:a.id,patient:a.patient,label:a.ward+' / Bed '+a.bed,kind:'Admission'})),...db.visits.filter(v=>v.status!=='Completed').map(v=>({id:v.id,patient:v.patient,label:v.id,kind:'OPD'}))]}
function nursingObserve(i){let x=nursingEntries()[i];if(!x)return;form('Fictional nursing observations',[['bp','Blood pressure','text'],['pulse','Pulse','text'],['temp','Temperature','text'],['resp','Respiratory rate','text'],['spo2','Oxygen saturation','text'],['condition','Patient condition','textarea'],['care','Care given','textarea'],['response','Patient response','textarea']],v=>{(db.extra['/nursing|0']??=[]).push({...v,patient:x.patient,encounter:x.id,date:new Date().toLocaleString(),status:'Recorded'});save('Recorded encounter-linked demo nursing observations')})}
function nursingView(){if(tab!==0)return '<h1>Nursing station</h1>'+extended();let rows=nursingEntries();return '<h1>Nursing station</h1><p>Active OPD and inpatient encounters · Fictional records</p><div class="tabs">'+['Patient Board','Medications','Filing'].map((t,i)=>'<button class="'+(i===tab?'primary':'')+'" onclick="changeTab('+i+')">'+t+'</button>').join('')+'</div><div class="card">'+table(['Patient','Encounter type','Location','Action'],rows.map((x,i)=>[esc(patient(x.patient)),esc(x.kind),esc(x.label),btn('Record observations','nursingObserve('+i+')')]))+'<h2 style="margin-top:22px">Observation history</h2>'+table(['Patient','Encounter','Date','BP','Pulse','Temp','Resp','SpO₂','Condition','Care','Response'],records('/nursing',0).map(x=>[esc(patient(x.patient)),esc(x.encounter),esc(x.date),esc(x.bp),esc(x.pulse),esc(x.temp),esc(x.resp),esc(x.spo2),esc(x.condition||x.note),esc(x.care),esc(x.response)]))+'</div>'}

render();</script></body></html>
