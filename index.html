<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediTrack Pro — Offline Demo V2</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f7faf8;color:#20332b}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce5df;border-radius:7px;padding:9px 13px;background:white;color:inherit}button:hover{background:#e8f3eb}.primary{background:#167443;color:white;border-color:#167443}.primary:hover{background:#125e37}aside{position:fixed;inset:0 auto 0 0;width:248px;background:#f0f6f1;border-right:1px solid #dce5df;overflow:auto;padding:17px 12px}.brand{font-size:19px;font-weight:750;color:#167443;margin:0 0 18px 8px}.group{font-size:11px;color:#687a70;margin:18px 9px 6px;text-transform:uppercase;font-weight:600}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px}.nav.active{background:#dceee0;font-weight:650;color:#16683e}main{margin-left:248px}header{height:56px;background:white;border-bottom:1px solid #dce5df;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}article{padding:24px;max-width:1600px;margin:auto}h1{font-size:24px;margin:0 0 5px}h2{font-size:16px;margin:0 0 15px}p{color:#65766c;margin:4px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce5df;border-radius:9px;padding:16px}.stat{font-size:26px;font-weight:700;margin-top:10px}.muted{color:#65766c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.notice{padding:10px 14px;background:#fff8e4;border:1px solid #eadcb2;border-radius:6px;color:#725819;margin-bottom:18px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5ebe7}th{font-size:12px;color:#65766c}input,select,textarea{border:1px solid #cfdcd3;border-radius:6px;padding:10px;background:white;max-width:100%}label{display:grid;gap:6px;margin:12px 0}dialog{border:1px solid #dce5df;border-radius:10px;padding:24px;width:min(480px,95vw)}dialog::backdrop{background:#20332b66}.pill{border-radius:15px;background:#e3f1e8;padding:4px 8px;font-size:12px}.bars{display:flex;align-items:flex-end;height:120px;gap:14px}.bars div{flex:1;background:#45966a;border-radius:4px 4px 0 0}.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.login section{display:grid;place-content:center;padding:40px}.login section+section{background:#167443;color:white}.login section+section p{color:#e0f4e6}#menu{display:none}@media(max-width:720px){aside{display:none;z-index:3}aside.open{display:block}main{margin:0}#menu{display:inline-block}article{padding:14px}.login{grid-template-columns:1fr}.login section+section{display:none}} </style><body><div id="app"></div><dialog id="modal"></dialog><script>
const groups=[["Overview", [["Dashboard", "/dashboard"], ["Notifications", "/notifications"], ["Chat", "/chat"]]], ["Administration", [["User Management", "/staff"]]], ["Clinical", [["Patient Search", "/patient-search"], ["Patients (Cash)", "/patients"], ["OPD Queue (Cash)", "/opd"], ["Appointments", "/appointments"], ["IPD", "/ipd"], ["Doctor's Office", "/doctor"], ["Nursing Station", "/nursing"]]], ["Diagnostics", [["Laboratory", "/lab"], ["Medical Imaging", "/imaging"]]], ["Services", [["Pharmacy", "/pharmacy"], ["Ambulance", "/ambulance"], ["Inventory", "/inventory"]]], ["Finance", [["Accounts", "/billing"], ["General Ledger", "/general-ledger"], ["Finance Analytics", "/finance-analytics"], ["Insurance", "/insurance"]]], ["HR & Reports", [["Attendance", "/attendance"], ["HR & Payroll", "/hr"], ["Reports", "/reports"], ["Settings", "/settings"], ["Audit Logs", "/audit-logs"]]], ["Resources", [["Holy Bible", "/bible"]]]];const key='meditrack-fictional-v1';const seed={patients:[{id:'MT-001',name:'Demo Patient A',age:32,sex:'Female',phone:'Demo only'},{id:'MT-002',name:'Demo Patient B',age:45,sex:'Male',phone:'Demo only'}],visits:[{id:'V-001',patient:'MT-001',status:'Waiting',note:''}],lab:[],rx:[],bills:[],audit:[]};let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{db=structuredClone(seed)}let route='/dashboard',signed=false;let tab=0;db.extra??={};const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(action){db.extra??={};db.audit.push({action,date:new Date().toLocaleString()});try{localStorage.setItem(key,JSON.stringify(db))}catch{} render()}function patient(id){return db.patients.find(p=>p.id===id)?.name||id}function nav(r){route=r;tab=0;render()}function login(){signed=true;render()}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function btn(label,action){return `<button onclick="${action}">${label}</button>`}function card(label,value,link){return `<button class="card" style="text-align:left" onclick="nav('${link}')"><span class="muted">${label}</span><div class="stat">${value}</div></button>`}function form(title,fields,callback){modal.innerHTML='<h2>'+title+'</h2><form id="f">'+fields.map(([name,label,type,options])=>'<label>'+label+(options?'<select name="'+name+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'" required></textarea>':'<input name="'+name+'" type="'+type+'" required '+(type==='number'?'min="0"':'')+'>')+'</label>').join('')+'<div class="row"><button type="button" onclick="modal.close()">Cancel</button><button class="primary">Save</button></div></form>';modal.querySelector('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));modal.close()};modal.showModal()}function register(){form('Register Patient',[['name','Fictional patient name','text'],['age','Age','number'],['sex','Sex','select',[['Female','Female'],['Male','Male'],['Other','Other']]],['phone','Demo contact label','text']],v=>{db.patients.push({...v,id:'MT-'+Date.now()});save('Registered fictional patient')})}function visit(i){db.visits.push({id:'V-'+Date.now(),patient:db.patients[i].id,status:'Waiting',note:''});save('Created OPD visit');nav('/opd')}function consult(i){form('Consultation — fictional notes only',[['note','Clinical note','textarea'],['status','Visit status','select',[['In consultation','In consultation'],['Completed','Completed']]]],v=>{Object.assign(db.visits[i],v);save('Updated consultation')})}function order(i,type){form(type==='lab'?'Laboratory order':'Prescription — demonstration only',[['item',type==='lab'?'Test name':'Item name','text']],v=>{db[type].push({patient:db.visits[i].patient,item:v.item,status:'Pending'});save('Created '+type+' order')})}function complete(type,i){db[type][i].status='Completed';save('Completed '+type+' order')}function bill(){form('Create demo invoice',[['patient','Patient','select',db.patients.map(p=>[p.id,p.name])],['item','Service','text'],['amount','Amount (SSP)','number']],v=>{db.bills.push({...v,status:'Unpaid'});save('Created invoice')})}function pay(i){db.bills[i].status='Paid';save('Recorded simulated payment')}function filterRows(v){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(v.toLowerCase()))}function content(){let title=groups.flatMap(g=>g[1]).find(x=>x[1]===route)?.[0]||'Dashboard';if(route==='/dashboard'){let metrics=[['OPD Patients',db.visits.length,'/opd'],['IPD Admissions',records('/ipd',0).filter(x=>x.status==='Admitted').length,'/ipd'],['Available Beds',Math.max(0,8-records('/ipd',0).filter(x=>x.status==='Admitted').length),'/ipd'],['Lab Orders',db.lab.length,'/lab'],['Rx Pending',db.rx.filter(x=>x.status==='Pending').length,'/pharmacy'],['Rx Completed',db.rx.filter(x=>x.status==='Completed').length,'/pharmacy'],['Doctors Active',1,'/doctor'],['Staff On Duty',1,'/attendance'],['Cash Patients',db.patients.length,'/patients'],['Insurance Patients',0,'/insurance'],['Total Patients',db.patients.length,'/patients'],['Revenue (SSP)',db.bills.filter(x=>x.status==='Paid').reduce((a,b)=>a+Number(b.amount),0).toLocaleString(),'/billing']];return '<h1>Welcome, Demo Administrator</h1><p>Hospital operations overview</p><div class="grid">'+metrics.map(x=>card(...x)).join('')+'</div><div class="grid"><div class="card"><h2>Clinical Summary</h2>Waiting visits: '+db.visits.filter(v=>v.status==='Waiting').length+'<p>Completed visits: '+db.visits.filter(v=>v.status==='Completed').length+'</p></div><div class="card"><h2>Laboratory & Pharmacy</h2>Pending tests: '+db.lab.filter(x=>x.status==='Pending').length+'<p>Pending prescriptions: '+db.rx.filter(x=>x.status==='Pending').length+'</p></div></div>'}let head='<div class="row"><div><h1>'+esc(title)+'</h1><p>Offline demonstration workspace</p></div>';let search='<input placeholder="Search records…" oninput="filterRows(this.value)">';if(['/patients','/patient-search'].includes(route))return '<div class="row"><div><h1>Patient Registry</h1><p>Comprehensive view of all registered patients</p></div>'+btn('Register Patient','register()')+'</div><div class="grid">'+card('Total Patients',db.patients.length,'/patients')+card('Cash Patients',db.patients.length,'/patients')+'</div><div class="card">'+search+table(['Registration No.','Name','Age','Sex','Contact','Action'],db.patients.map((p,i)=>[esc(p.id),esc(p.name),esc(p.age),esc(p.sex),esc(p.phone),btn('Start visit',`visit(${i})`)]))+'</div>';if(['/opd','/doctor'].includes(route))return head+'</div><div class="card">'+search+table(['Visit','Patient','Status','Clinical note','Actions'],db.visits.map((v,i)=>[esc(v.id),esc(patient(v.patient)),esc(v.status),esc(v.note),btn('Consult',`consult(${i})`)+' '+btn('Lab order',`order(${i},\'lab\')`)+' '+btn('Prescription',`order(${i},\'rx\')`)]))+'</div>';if(['/lab','/pharmacy'].includes(route)){let t=route==='/lab'?'lab':'rx';return head+'</div><div class="card">'+search+table(['Patient','Item','Status','Action'],db[t].map((v,i)=>[esc(patient(v.patient)),esc(v.item),esc(v.status),v.status==='Pending'?btn('Mark complete',`complete(\'${t}\',${i})`):'—']))+'</div>'}if(route==='/billing')return head+btn('Create invoice','bill()')+'</div><div class="card">'+table(['Patient','Service','SSP','Status','Action'],db.bills.map((v,i)=>[esc(patient(v.patient)),esc(v.item),esc(v.amount),esc(v.status),v.status==='Unpaid'?btn('Record payment',`pay(${i})`):'—']))+'</div>';if(route==='/audit-logs')return head+'</div><div class="card">'+table(['Action','Time'],db.audit.map(v=>[esc(v.action),esc(v.date)]))+'</div>';return head+'</div>'+extended()}
const F=(name,label,type='text')=>[name,label,type];
const P=()=>['patient','Patient','patient'];
const modules={
'/appointments':[['Day','Appointment',[P(),F('date','Date','date'),F('time','Time','time'),F('reason','Reason')],['Scheduled','Checked in','Completed','Cancelled']],['Week','Appointment view','mirror']],
'/ipd':[['Admissions','Admission',[P(),F('ward','Ward'),F('bed','Bed'),F('reason','Admission reason')],['Admitted','Discharged']],['Wards','Ward',[F('name','Ward name'),F('capacity','Bed capacity','number')],['Active','Inactive']],['Discharged','Discharged admissions','discharged'],['Reports','Admission report','summary']],
'/nursing':[['Patient Board','Vitals / nursing note',[P(),F('bp','Blood pressure'),F('pulse','Pulse'),F('temp','Temperature'),F('note','Nursing note','textarea')],['Recorded','Reviewed']],['Medications','Medication administration',[P(),F('medicine','Fictional medication label'),F('note','Administration note')],['Pending','Recorded']],['Filing','Document reference',[P(),F('name','Document title')],['Filed','Reviewed']]],
'/imaging':[['Worklist','Imaging request',[P(),F('study','Study'),F('findings','Demo findings','textarea')],['Requested','In progress','Reported']],['Uploads','Image reference',[P(),F('name','Fictional file reference')],['Recorded','Reviewed']]],
'/ambulance':[['Dispatch','Dispatch',[F('pickup','Pickup'),F('destination','Destination'),F('vehicle','Vehicle')],['Requested','Dispatched','Completed']],['Fleet','Vehicle',[F('name','Vehicle identifier'),F('driver','Demo driver')],['Available','On trip','Maintenance']],['Call Log','Call',[F('caller','Demo caller'),F('reason','Reason')],['Logged','Closed']],['Trip Stats','Trip statistics','summary']],
'/inventory':[['Consumables','Stock item',[F('name','Item'),F('quantity','Quantity','number'),F('unit','Unit')],['Available','Low stock','Out of stock']],['Assets','Asset',[F('name','Asset'),F('tag','Asset tag'),F('location','Department')],['Operational','Maintenance','Retired']]],
'/insurance':[['Dashboard','Insurance overview','summary'],['Patients','Insurance enrollment',[P(),F('provider','Provider'),F('member','Demo membership number')],['Active','Inactive']],['Claims','Claim',[P(),F('provider','Provider'),F('amount','Amount SSP','number')],['Draft','Submitted','Approved','Rejected','Paid']],['Providers','Provider',[F('name','Provider'),F('contact','Demo contact')],['Active','Inactive']],['Price Lists','Service price',[F('service','Service'),F('price','Price SSP','number')],['Active','Inactive']],['Staff Cover','Staff coverage',[F('staff','Demo staff'),F('plan','Plan')],['Active','Inactive']],['Reports','Insurance report','summary']],
'/general-ledger':[['Chart of Accounts','Account',[F('code','Code'),F('name','Account name'),F('type','Account type')],['Active','Inactive']],['Journal Entries','Balanced journal entry',[F('debit','Debit account'),F('credit','Credit account'),F('amount','Amount SSP','number'),F('memo','Narration')],['Draft','Posted']],['Account Ledger','Posted entries','journal'],['Financial Reports','Ledger summary','summary'],['Fiscal Periods','Fiscal period',[F('start','Start date','date'),F('end','End date','date')],['Open','Closed']]],
'/finance-analytics':[['Overview','Cash collections','finance']],
'/attendance':[['Attendance','Attendance record',[F('staff','Demo staff'),F('date','Date','date'),F('in','Clock in','time'),F('out','Clock out','time')],['Recorded','Verified']]],
'/hr':[['Employees','Employee',[F('name','Fictional name'),F('department','Department'),F('role','Role')],['Active','Inactive']],['Leave Requests','Leave request',[F('staff','Demo employee'),F('start','Start','date'),F('end','End','date'),F('reason','Reason')],['Pending','Approved','Rejected']],['Payroll','Payroll record',[F('staff','Demo employee'),F('month','Month','month'),F('amount','Gross SSP','number')],['Draft','Processed','Paid']],['Attendance','Attendance overview','attendance']],
'/staff':[['Users','Demo user',[F('name','Fictional staff name'),F('role','Role'),F('department','Department')],['Active','Inactive']],['Permissions','Role / permission label',[F('role','Role'),F('permission','Permission description')],['Enabled','Disabled']]],
'/settings':[['General','Setting',[F('name','Setting'),F('value','Value')],['Saved']],['Departments','Department',[F('name','Department')],['Active','Inactive']],['Categories','Category',[F('name','Category')],['Active','Inactive']],['Services','Service',[F('name','Service'),F('price','Price SSP','number')],['Active','Inactive']],['Lab Services','Lab service',[F('name','Test'),F('price','Price SSP','number')],['Active','Inactive']],['Currency','Currency',[F('name','Currency code'),F('rate','Rate','number')],['Active','Inactive']]],
'/notifications':[['All','Activity notifications','notifications'],['Unread','Unread activity','unread'],['Read','Read activity','read']],
'/chat':[['Messages','Local message',[F('recipient','Demo recipient'),F('message','Message','textarea')],['Saved locally']]],
'/reports':[['Overview','Demo activity overview','finance'],['Income Statement','Cash collections only','finance'],['Insurance','Insurance activity','insurance'],['Payroll','Payroll activity','payroll'],['Facility Performance','Clinical activity','clinical']],
'/bible':[['Read','Reading','bible'],['Search','Search','bible']]
};
function records(r,t){return db.extra?.[r+'|'+t]||[]}
function changeTab(t){tab=t;render()}
function fieldsFor(spec){return spec[2].map(f=>f[2]==='patient'?[f[0],f[1],'select',db.patients.map(p=>[p.id,p.name])]:f)}
function addExtra(){let spec=modules[route][tab],k=route+'|'+tab;form('New '+spec[1],fieldsFor(spec),v=>{db.extra??={};(db.extra[k]??=[]).push({...v,status:spec[3][0]});save('Created '+spec[1])})}
function editExtra(i){let spec=modules[route][tab],r=records(route,tab)[i];form('Update '+spec[1],[['status','Status','select',spec[3].map(x=>[x,x])]],v=>{r.status=v.status;save('Updated '+spec[1])})}
function listing(spec,rows,editable=false){return table([...spec[2].map(f=>f[1]),'Status',...(editable?['Action']:[])],rows.map((r,i)=>[...spec[2].map(f=>esc(f[2]==='patient'?patient(r[f[0]]):r[f[0]])),esc(r.status),...(editable?[btn('Update',`editExtra(${i})`)]:[])]))}
function exportExtra(){let spec=modules[route][tab],rows=records(route,tab);let quote=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';let csv=[spec[2].map(f=>f[1]).concat('Status').map(quote).join(','),...rows.map(r=>spec[2].map(f=>quote(r[f[0]])).concat(quote(r.status)).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='meditrack-demo.csv';a.click();URL.revokeObjectURL(a.href)}
function extended(){let specs=modules[route];if(!specs)return '';let spec=specs[tab]||specs[0],mode=spec[2],body='';if(Array.isArray(mode)){body='<div class="row"><input placeholder="Search records…" oninput="filterRows(this.value)">'+btn('Export CSV','exportExtra()')+btn('New '+spec[1],'addExtra()')+'</div>'+listing(spec,records(route,tab),true)}else if(mode==='mirror'||mode==='discharged'||mode==='journal'){let i=mode==='journal'?1:0;body=listing(specs[i],records(route,i).filter(r=>mode==='mirror'||r.status===(mode==='journal'?'Posted':'Discharged')))}else if(['attendance','insurance','payroll'].includes(mode)){let [r,i]=mode==='attendance'?['/attendance',0]:mode==='insurance'?['/insurance',2]:['/hr',2];body=listing(modules[r][i],records(r,i))}else if(mode==='finance'){let paid=db.bills.filter(x=>x.status==='Paid').reduce((a,b)=>a+Number(b.amount),0),unpaid=db.bills.filter(x=>x.status==='Unpaid').reduce((a,b)=>a+Number(b.amount),0);body='<div class="grid">'+card('Collected SSP',paid.toLocaleString(),'/billing')+card('Outstanding SSP',unpaid.toLocaleString(),'/billing')+card('Invoices',db.bills.length,'/billing')+'</div><p>Simulated cash collections; not an accrual income statement or audited report.</p>'}else if(mode==='clinical'){body='<div class="grid">'+card('Visits',db.visits.length,'/opd')+card('Lab orders',db.lab.length,'/lab')+card('Admissions',records('/ipd',0).length,'/ipd')+'</div>'}else if(mode==='summary'){body='<div class="grid">'+specs.map((x,i)=>Array.isArray(x[2])?'<div class="card">'+esc(x[0])+'<div class="stat">'+records(route,i).length+'</div></div>':'').join('')+'</div>'}else if(['notifications','read','unread'].includes(mode)){let seen=db.seen||0;body=btn('Mark all read','markRead()')+table(['Activity','Time'],db.audit.filter((x,i)=>mode==='notifications'||(mode==='read'?i<seen:i>=seen)).map(x=>[esc(x.action),esc(x.date)]))}else if(mode==='bible'){body='<p>Original reading and search navigation retained. Bible content and audio services are not bundled in this offline demo.</p>'}return '<div class="tabs">'+specs.map((x,i)=>`<button class="${i===tab?'primary':''}" onclick="changeTab(${i})">${esc(x[0])}</button>`).join('')+'</div><div class="card"><h2>'+esc(spec[1])+'</h2>'+body+'</div>'}
function markRead(){db.seen=db.audit.length;try{localStorage.setItem(key,JSON.stringify(db))}catch{}render()}

function render(){if(!signed){app.innerHTML='<div class="login"><section><div><div class="brand">✚ MediTrack Pro</div><h1>Login to Your Account</h1><p>Enter the independent, fictional-data demo.</p><button class="primary" onclick="login()">Enter demo</button><p>Not a secure clinical system. Do not enter real patient data.</p></div></section><section><h1>Hospital Management System</h1><p>Integrated clinical and administrative workflows</p></section></div>';return}app.innerHTML='<aside id="sidebar"><div class="brand">✚ MediTrack Pro</div>'+groups.map(([g,items])=>'<div class="group">'+g+'</div>'+items.map(([n,r])=>`<button class="nav ${r===route?'active':''}" onclick="nav('${r}')">${n}</button>`).join('')).join('')+'</aside><main><header><button id="menu" onclick="document.querySelector(\'#sidebar\').classList.toggle(\'open\')">☰</button><span>Hospital Management System</span><span class="pill">Demo Administrator</span><button onclick="if(confirm(\'Reset all fictional demo records?\')){db=structuredClone(seed);save(\'Reset demo\')}">Reset</button><button onclick="signed=false;render()">Sign out</button></header><article><div class="notice">Offline preview V2 · Fictional data only · No connection to iCURE</div>'+content()+'</article></main>'}render();</script></body></html>
